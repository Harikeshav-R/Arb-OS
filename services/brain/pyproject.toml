[project]
name = "arbos-brain"
version = "0.1.0"
description = "ArbOS Brain Service — AI-driven logical relationship discovery for Polymarket"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "langchain-core>=0.3.0",
    "langchain-ibm>=0.3.0",
    "langgraph>=0.4.0",
    "httpx>=0.28.0",
    "loguru>=0.7.0",
    "networkx>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "pytest-httpx>=0.35.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100
